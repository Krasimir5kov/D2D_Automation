                - listitem [ref=f2e116]: Услугата "Безплатна пощенска кутия" включва предоставяне на Регистрирания потребител на една безплатна електронна пощенска кутия от типа vie@abv.bg, vie@gbg.bg, vie@gyuvetch.bg, до която той има достъп през своя Потребителски профил. Дисковото пространство, предоставяно за ползуване от Регистрирания потребител за пощенска кутия е ограничено. Нет Инфо не носи отговорност за изтриване, връщане или неполучаване на съобщения или друга информация, поради ограниченото дисково пространство. За Услуги по предоставяне на определен вид достъп до мобилната версия на услугата "Безплатна пощенска кутия" чрез мобилна мрежа, между Регистрирания потребител и съответния мобилен оператор може да се договори заплащане на абонаментни такси, дължими от Регистрирания потребител на мобилния оператор. Нет Инфо не е страна по договора между Регистрирания потребител и мобилния оператор и не носи отговорност за изпълнение на задълженията помежду им.
                - listitem [ref=f2e117]: (изм. в сила от 25.05.2018 г.) Услугата "DOX.bg" предоставя на Регистрирания потребител възможност за съхраняване на файлове на сървъра на Нет Инфо посредством Потребителския му профил, както и възможността Абонатът да прави така съхранената информация достъпна и за други лица. Дисковото пространство, предоставяна на Регистрирания потребител за съхраняване на файлове е ограничено. За Услугата "DOX.bg" са налични отделни Общи условия.
