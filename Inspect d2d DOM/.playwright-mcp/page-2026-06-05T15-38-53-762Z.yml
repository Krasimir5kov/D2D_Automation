                - listitem [ref=f2e93]: В случаите, когато за ползването на конкретна услуга на съответната Интернет страница се изисква плащане на определена цена, Регистрираният потребител прави конкретна заявка за активиране на съответната услуга от Нет Инфо на базата на сключения договор между страните.
                - listitem [ref=f2e94]: По заявките за страните възникват всички права и задължения, предвидени в настоящите Общи условия. Конкретните условия за предоставяне на всяка платена услуга са описани на съответната Интернет страница в ABV.bg
                - listitem [ref=f2e95]:
                  - text: "(изм. в сила от 25.05.2018 г.)Регистриран потребител, който не е търговец, има право, без да дължи обезщетение или неустойка и без да посочва причина, да се откаже от сключения във връзка с конкретна заявка индивидуален договор в срок 7 (седем) работни дни от сключването му, съгласно изискванията на Закона за защита на потребителите. Изявлението за отказ следва да бъде изпратено до Нет Инфо по факс: (+359 2) 963 41 79 или на"
