                  - text: . Нет Инфо възстановява на Регистрирания потребител в пълен размер заплатената от него сума за активиране на съответната платена услуга до 30 (тридесет) дни от датата, на която същият е упражнил правото си по тази алинея.
                - listitem [ref=f2e97]: При опосредяване заплащането на съответната Услуга или пакет от Услуги посредством изпращане на SMS или закупуване на карта ваучер с всяко изпращане на SMS или закупуване на карта ваучер се сключва отделен индивидуален договор, който поражда действие от момента на въвеждане от Регистрирания потребител на получения код за активация в полето "Ключ", повторно въвеждане на кода за активация и натискане на бутона "Въведи". В случай, че Регистрираният потребител не въведе кода за активация в срок от 6 (шест) месеца от получаване на кода, индивидуалният договор се счита за прекратен. В случаите на заплащане посредством изпращане на SMS се счита, че с изпращане на съответния SMS Регистрираният потребител е дал своето изрично съгласие за започване на предоставяне на услугата и ал. 5 от настоящия член не се прилага.
                - listitem [ref=f2e98]: При възникнал спор кое лице е изявило воля за обвързване с текста на Общите условия, за страна по него се счита лицето, което е заплатило цената/абонаментната такса за ползване на съответната услуга.
