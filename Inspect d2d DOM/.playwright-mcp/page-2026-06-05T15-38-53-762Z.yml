              - paragraph [ref=f2e131]: Максималният размер за входящо писмо, което потребител на АБВ Поща може да получи е 20 MB.
              - heading "SMPT" [level=2] [ref=f2e132]
              - paragraph [ref=f2e133]: SMTP (Simple Mail Transfer Protocol) е протокол за изпращане на електронна поща между сървъри. Повечето имейл системи, които изпращат поща, използват SMTP протокол, след което писмата могат да се изтеглят с POP3 или IMAP протокол от локален клиент/програма.
              - heading "АБВ на твой домейн" [level=2] [ref=f2e134]
              - paragraph [ref=f2e135]: С услугата "АБВ на твой домейн" можете да регистрирате до десет имейл адреса на ваш собствен домейн (напр. office@mycompany.bg), без да променяте навиците си, като продължите да използвате познатите ви функционалности и дизайн на АБВ Поща.
