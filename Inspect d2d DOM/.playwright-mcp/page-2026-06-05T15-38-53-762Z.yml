          - generic [active] [ref=f2e1]:
            - generic [ref=f2e2]: Реклама
            - generic [ref=f2e3]:
              - heading "Общи условия за ползване на услугите, достъпни през уебсайта ABV.bg (загл. изм. в сила от 06.02.2019 г.)" [level=1] [ref=f2e4]:
                - text: Общи условия за ползване на услугите, достъпни през уебсайта ABV.bg
                - text: (загл. изм. в сила от 06.02.2019 г.)
              - paragraph [ref=f2e5]: "Настоящият документ съдържа общите условия за ползване на предоставяните от \"Нет Инфо\" ЕАД информационни ресурси и услуги на потребителите на уебсайтa www.abv.bg и урежда отношенията между \"Нет Инфо\" ЕАД, със седалище и адрес на управление: гр. София 1592, р-н Искър, бул. \"Христофор Колумб\" № 41, ет. 6 (наричано по-долу за краткост \"Нет Инфо\") и всеки един от регистрираните потребители на Услугите, достъпни чрез уебсайта abv.bg."
              - heading "I. OБЩИ РАЗПОРЕДБИ" [level=2] [ref=f2e6]
              - heading "Дефиниции" [level=3] [ref=f2e7]
              - paragraph [ref=f2e8]:
                - strong [ref=f2e9]: Чл. 1.
                - text: "При прилагане и тълкуване на настоящите Общи условия използваните термини и изрази ще имат следното значение:"
              - list [ref=f2e10]:
                - listitem [ref=f2e11]:
                  - text: (изм. в сила от 25.05.2018 г.) ABV.bg (
                  - link "http://www.abv.bg" [ref=f2e12] [cursor=pointer]:
                    - /url: https://www.abv.bg
                  - text: ) е уебсайт - виртуални информационни ресурси в Интернет, собственост на Нет Инфо, които дават възможност за ползване на различни услуги, предмет на настоящите Общи условия.
                - listitem [ref=f2e13]:
                  - strong [ref=f2e14]: Електронна препратка
                  - text: е връзка, обозначена в определена Интернет страница, която позволява автоматизирано препращане към друга Интернет страница, информационен ресурс или обект чрез стандартизирани протоколи.
                - listitem [ref=f2e15]:
                  - strong [ref=f2e16]: Злоумишлени действия
                  - text: са действия или бездействия, нарушаващи Интернет етиката или нанасящи вреди на лица, свързани към Интернет или асоциирани мрежи, изпращане на нежелана поща (непоискани търговски съобщения, SPAM, JUNK MAIL), препълване на каналите (FLOOD), получаване на достъп до ресурси с чужди права и пароли, използуване на недостатъци в системите с цел собствена облага или добиване на информация (HACK), извършване на действия, които могат да бъдат квалифицирани като промишлен шпионаж или саботаж, повреждане или разрушаване на системи или информационни масиви (CRACK), изпращане на "троянски коне" или предизвикване инсталация на вируси или системи за отдалечен контрол, смущаване нормалната работа на останалите потребители на Интернет и асоциираните мрежи, извършване на каквито и да е било действия, които могат да се квалифицират като престъпление или административно нарушение по българското законодателство или по друго приложимо право.
                - listitem [ref=f2e17]:
                  - strong [ref=f2e18]: Информационна система /Система
                  - text: е всяко отделно устройство или съвкупност от взаимосвързани или сходни устройства, което в изпълнение на определена програма осигурява или един от елементите на което осигурява автоматична обработка на данни.
                - listitem [ref=f2e19]:
                  - strong [ref=f2e20]: Интернет страница
                  - text: по смисъла на настоящите Общи условия означава съставна и обособена част от уебсайт.
                - listitem [ref=f2e21]:
                  - text: (изм. в сила от 25.05.2018 г.)
                  - strong [ref=f2e22]: IP Адрес
                  - text: ("IP address") е уникален идентификационен номер, асоцииращ компютър или друго устройство, Интернет страница или ресурс на Регистрирания потребител, по начин, който позволява локализирането им в глобалната Интернет мрежа.
                - listitem [ref=f2e23]:
                  - text: 7) (изм. в сила от 15.08.2016 г.)
                  - strong [ref=f2e24]: Контекстен и поведенчески анализ
                  - text: "- подходи, основаващи се на автоматизиран анализ, непозволяващ персонализирането на потребители на (i) съдържанието на Интернет страници, заредени (текущо или в предходен момент) от Регистрирания потребител; и/или (ii) информация за домейните на трети лица, изпратили електронно съобщение (e-mail) до Регистриран потребител, получено в Потребителския му профил; и/или (iii) мета-данни от Потребителския профил на Регистрирания потребител, предмет и текст на съобщението."
                - listitem [ref=f2e25]:
                  - text: (изм. в сила от 25.05.2018 г.)
                  - strong [ref=f2e26]: Мобилна версия на услугата
                  - text: – модифицирана версия на предоставяна от Нет Инфо услуга, даваща възможност на абонатите и потребителите на мобилни мрежи да имат улеснен достъп и да ползват част от услугите, предмет на настоящите Общи условия, чрез ползване на услуги за достъп до интернет и пренос на данни, предоставяни от съответните мобилни оператори чрез мобилните мрежи.
                - listitem [ref=f2e27]:
                  - strong [ref=f2e28]: Нерегистриран потребител
                  - text: е всеки Потребител, който не отговаря на критериите за Регистриран потребител.
                - listitem [ref=f2e29]:
                  - text: "(изм. в сила 06.02.2019 г.) \"Нет Инфо\" ЕАД (Нет Инфо) е търговското дружество с ЕИК 202632567, със седалище и адрес на управление: гр. София 1592, р-н Искър, бул. \"Христофор Колумб\" № 41, ет. 6, правоприемник на \"Нет Инфо.БГ\" ЕАД по силата на договор за прехвърляне на търговско предприятие от 30.09.2013 г., предоставящо посредством администрирания от него уебсайт ABV.bg ("
                  - link "http://www.abv.bg" [ref=f2e30] [cursor=pointer]:
                    - /url: http://www.abv.bg
                  - text: ") Услуги. Телефоните за контакт с Нет Инфо са, както следва: (1) тел. (+359 2) 960 31 98 – телефон единствено за установяване на контакт с екипа за техническа поддръжка на Услугите (при технически проблеми, проблеми с установяване на достъп до електронна пощенска кутия, проблеми при използване на електронна пощенска кутия и т.н.); и (2) тел.(+359 2) 960 31 00 – телефон за установяване на контакт с регистратура на Нет Инфо. Алтернативно, за връзка с ABV.bg посредством електронна форма за контакт, моля натиснете"
                  - link "тук" [ref=f2e31] [cursor=pointer]:
                    - /url: https://passport.abv.bg/app/profiles/sendtosupport/form
                  - text: ". Повече информация относно цялото портфолио от уебсайтове и услуги, вкл. рекламни, предлагани от Нет Инфо можете да намерите на:"
                  - link "https://www.netinfocompany.bg/" [ref=f2e32] [cursor=pointer]:
                    - /url: https://www.netinfocompany.bg/
                  - text: .
                - listitem [ref=f2e33]:
                  - strong [ref=f2e34]: Парола
                  - text: е избран от Регистрирания потребител код от букви, цифри и знаци, който заедно с Потребителското име индивидуализира същия и който заедно с Потребителското име служи за достъп до Потребителския му профил.
                - listitem [ref=f2e35]:
                  - text: (изм. в сила от 25.05.2018 г.)
                  - strong [ref=f2e36]: Потребител
                  - text: е всяко лице, което ползва Услугите, предоставяни посредством ABV.bg.
                - listitem [ref=f2e37]:
                  - strong [ref=f2e38]: Потребителско име
                  - text: е избран от Регистрирания потребител уникален код от букви, цифри и знаци, посредством които той се индивидуализира в ABV.bg и/или в DOX.bg.
                - listitem [ref=f2e39]:
                  - text: (изм. в сила от 25.05.2018 г.)
                  - strong [ref=f2e40]: Потребителски профил
                  - text: е обособена част от уебсайта ABV.bg, съдържаща информация за Регистрирания потребител, изисквана от Нет Инфо при регистрацията и съхранявана при Нет Инфо, като достъпът до Потребителския профил от Регистрирания потребител се осъществява чрез въвеждане на Потребителско име и Парола. Потребителският профил дава възможност на Регистрирания потребител да ползва определени Услуги, до които достъпът е ограничен, да конфигурира ползването на Услугите, да прави предложения за включване на нови Услуги, да прекрати ползването на Услугите, да променя Паролата си и др.
                - listitem [ref=f2e41]:
                  - text: (изм. в сила от 15.08.2016 г.)
                  - strong [ref=f2e42]: Предназначение на контекстния и поведенчески анализ
                  - text: e определяне на лингвистични зависимости, по-специално - семантичен анализ, PLSA, LDA и други, базирани на неперсонализирани данни и позволяващи адаптиране на съдържанието на Уебсайтовете, показвани на Регистрирания потребител; показване на относими резултати при търсене; за предотвратяване получаването на нежелана електронна поща; за защита от зловреден софтуер; за показване на таргетирана реклама и др.
                - listitem [ref=f2e43]:
                  - text: (изм. в сила от 25.05.2018 г.)
                  - strong [ref=f2e44]: Регистриран потребител
                  - text: е всеки Потребител, създал собствен Потребителски профил и регистрирал се да ползува Услугите, достъпни чрез уебсайта ABV.bg.
                - listitem [ref=f2e45]:
                  - strong [ref=f2e46]: Случайно събитие
                  - text: е непредвидено към момента на сключването на договора обстоятелство от извънреден характер, което прави предоставянето на Услугите обективно невъзможно.
                - listitem [ref=f2e47]:
                  - strong [ref=f2e48]: Сървър
                  - text: е устройство или система от свързани устройства, на което или на някое от които е инсталиран системен софтуер за изпълняване на задачи във връзка със съхраняване, обработка, приемане или предаване на информация.
                - listitem [ref=f2e49]:
                  - strong [ref=f2e50]: Уебсайт / сайт
                  - text: ("website") е обособено място в глобалната Интернет мрежа, достъпно чрез своя унифициран адрес (URL) по протокол HTTP, HTTPS или друг стандартизиран протокол и съдържащо файлове, програми, текст, звук, картина, изображение или други материали и ресурси.
                - listitem [ref=f2e51]: (изм. в сила от 25.05.2018 г.) Услуги са Услугите, предоставяни посредством ABV.bg.
                - listitem [ref=f2e52]:
                  - strong [ref=f2e53]: Услуги, предоставяни посредством ABV.bg
                  - text: са предоставяните на Потребителите чрез ABV.bg услуги и ресурси като електронна пощенска кутия, АБВ форуми, достъп до определени публицистични материали, възможност за персонализиране на съдържанието и други услуги, предмет на непрекъснато развитие и допълване. Услугите могат да бъдат безплатни или платени. Конкретните услуги и условията на предоставянето им са описани на съответните Интернет страници в ABV.bg.
                - listitem [ref=f2e54]: (отм. в сила от 25.05.2018 г.)
              - heading "Предмет" [level=3] [ref=f2e55]
              - paragraph [ref=f2e56]:
                - strong [ref=f2e57]: Чл.2.
              - list [ref=f2e58]:
                - listitem [ref=f2e59]: (изм. в сила от 25.05.2018 г.) Нет Инфо предоставя на Потребителите безплатно или срещу възнаграждение предвидените и описани по-долу Услуги при съобразяване и стриктно спазване от страна на Потребителя на настоящите Общи условия, както и на допълнително посочени на съответните Интернет страници в ABV.bg изисквания за конкретните Услуги.
                - listitem [ref=f2e60]: (изм. в сила от 25.05.2018 г.)Услугите, предмет на настоящите Общи условия, предоставяни от Нет Инфо на Потребителя, включват комплекс от ресурси и услуги, предварително определени от Нет Инфо като предоставяни срещу регистрация или срещу регистрация и заплащане на определена цена и оповестени на Интернет страниците в ABV.bg.
                - listitem [ref=f2e61]: Нет Инфо може да осигури на Регистрирания потребител възможност за ползване през мобилна мрежа, на която същият е абонат или потребител, на мобилна версия на предоставяната услуга "Безплатна пощенска кутия" или на други Услуги, предмет на настоящите Общи условия.
                - listitem [ref=f2e62]: (изм. в сила от 25.05.2018 г.) Предоставянето на Услугите и достъпа до ресурсите не обхваща осигуряване на компютърно или друго техническо оборудване и свързаност за пренос на информационни пакети между Потребителя и Интернет страницата, необходими за осъществяване достъп до ресурсите на системата. Нет Инфо не носи отговорност, ако Абонатът не може да осъществи достъп, поради проблеми извън контрола на Нет Инфо (хардуерен, софтуерен проблем, проблем с Интернет свързаност, софтуерна и/или хардуерна несъвместимост и др.), както и за заплащане на дължимите от Потребителя на доставчиците на услуги по достъп и пренос възнаграждения.
              - paragraph [ref=f2e63]:
                - strong [ref=f2e64]: Чл. 3.
                - text: Доколкото предоставяните от Нет Инфо Услуги са разнообразни и постоянно допълвани и модифицирани с оглед тяхното подобряване и разширяване, то на това основание броят, характеристиките на предоставяните Услуги и режимът им на предоставяне (срещу регистрация, срещу регистрация и заплащане или без регистрация) могат да бъдат променяни по всяко време от Нет Инфо.
              - paragraph [ref=f2e65]:
                - strong [ref=f2e66]: Чл. 4.
              - list [ref=f2e67]:
                - listitem [ref=f2e68]: (изм. в сила от 25.05.2018 г.) За да използва предоставяните от Нет Инфо Услуги, Потребителят е длъжен предварително да се регистрира, като попълни съответната електронна форма за регистрация, достъпна в реално време (on-line) в Интернет на страницата на ABV. и да изрази съгласие с настоящите Общи условия, както и съгласие личните му данни да бъдат обработвани във връзка с предоставяните от Нет Инфо Услуги. При регистрация на непълнолетно лице (между 14 и 18 години), същото декларира и съгласието на своите родители или попечители с Общите условия. В случаите на регистрация на лице под 14-годишна възраст, заявлението за съгласие с Общите условия се извършва от родител или настойник на същото.
                - listitem [ref=f2e69]:
                  - text: (изм. в сила от 25.05.2018 г.) Чрез отбелязване в полето "Съгласен съм с Общите условия" и натискане на виртуалния бутон "Потвърди", Регистрираният потребител извършва електронно изявление по смисъла на Закона за електронния документ и електронните удостоверителни услуги, с което декларира, че е запознат с настоящите Общи условия, приема ги и се задължава да ги спазва. Със записването му на съответен носител в сървъра на Нет Инфо чрез общоприет стандарт за преобразуване по технически начин, правещ възможно неговото възпроизвеждане, електронното изявление придобива качеството на електронен документ по смисъла на цитирания закон. Нет Инфо може да съхранява в лог-файлове на своя сървър IP адреса на Регистрирания потребител, както и всяка друга информация, необходима за идентифициране на Регистрирания потребител и възпроизвеждане на електронното му изявление за приемане на Общите условия, в случай на възникване на правен спор. Текстът на настоящите Общи условия е достъпен в Интернет на адрес
                  - link "https://passport.abv.bg/app/profiles/resources/terms/terms.html" [ref=f2e70] [cursor=pointer]:
                    - /url: https://passport.abv.bg/app/profiles/resources/terms/terms.html
                  - text: по начин, който позволява неговото съхраняване и възпроизвеждане.
                - listitem [ref=f2e71]: (доп. в сила от 25.05.2018 г.)Преди извършване на изявлението по ал. 2 Регистрираният потребител може свободно да поправя въведената от него информация в регистрационната форма. В тази връзка, имате право и във всеки последващ момент да поискате коригирането или актуализирането на информацията, която първоначално сте въвели.
                - listitem [ref=f2e72]: За използването на платените Услуги, предоставяни от Нет Инфо, освен регистрация на Регистрирания потребител е необходимо и заплащане на съответна цена или абонаментна такса по един от указаните на съответната Интернет страница начини.
                - listitem [ref=f2e73]: (изм. в сила от 25.05.2018 г.) С регистрирането си в ABV.bg и придобиване качеството "Регистриран потребител", всеки Регистриран потребител получава достъп до всички предлагани от Нет Инфо Услуги, изискващи само регистрация и достъпни както чрез ABV.bg, така и чрез уебсайта www.DOX.bg, без да е необходимо да се регистрира отделно във всеки един от двата уебсайта.
                - listitem [ref=f2e74]: (изм. и доп. в сила от 25.05.2018 г., изм. в сила от 18.05.2020 г.) При попълване заявлението за регистрация в ABV.bg Регистрираният потребител, а в случаите на ал. 1, предложение последно, родителят или настойникът на Регистрирания потребител, е длъжен да предостави пълни и верни данни относно самоличността (за физическите лица) или другите изискуеми от електронната форма на Нет Инфо данни, както и да ги актуализира в 7-дневен срок от тяхната промяна. Регистрираният потребител гарантира, че данните, които предоставя в процеса на регистрация, са верни, пълни и точни и при промяна на последните, ще ги актуализира своевременно. В случай на предоставяне на неверни данни, Нет Инфо има право да прекрати или спре незабавно и без предизвестие предоставянето на Услугите, както и поддържането на регистрацията на Регистрирания потребител. За повече информация относно правата и задълженията във връзка с личните данни, моля да прочетете Раздел IV "Защита на личните данни".
                - listitem [ref=f2e75]: Родителите, упражняващи родителски права, настойниците или попечителите на ненавършило пълнолетие лице, отговарят за всички вреди, причинени от същото, на Нет Инфо и на трети лица при регистрацията и ползването на Услугите - предмет на настоящите Общи условия, както и за всички вреди в следствие посочване на неверни данни или неистинност на декларацията по ал. 1, изречение последно.
                - listitem [ref=f2e76]: (отм. в сила от 25.05.2018 г.)
              - heading "Потребителско име и парола" [level=3] [ref=f2e77]
              - paragraph [ref=f2e78]:
                - strong [ref=f2e79]: Чл. 5.
              - list [ref=f2e80]:
                - listitem [ref=f2e81]: (изм. в сила от 25.05.2018 г.) При регистрацията си Потребителят посочва Потребителско име и Парола за достъп до Услугите, достъпни през уебсайта ABV.bg. Ако Потребителското име не е вече заето, Потребителят получава Потребителското име и Паролата, които е заявил. В случай, че избраното Потребителско име е вече заето, Потребителят следва да избере друго такова, което да е уникално и да не е регистрирано от друг Регистриран потребител.
                - listitem [ref=f2e82]: (изм. в сила от 25.05.2018 г.) Потребителското име, с което Потребител е регистриран в ABV.bg, не му дава никакви други права, освен правото на първия заявил конкретното Потребителско име в рамките на информационната система на Нет Инфо за срока на действие на договора. Нет Инфо не проверява и не носи отговорност за истинността на Потребителското име, за това дали то засяга права на трети лица и в частност право на име или други лични права, право на търговско наименование (фирма), право на запазена марка или други права на интелектуална собственост.
                - listitem [ref=f2e83]: (изм. в сила от 18.05.2020 г.) Регистрираният потребител е длъжен да полага всички грижи и да предприема необходимите мерки, които разумно се налагат, с цел опазване на паролата си, както и да не прави достояние на трети лица Паролата си и отговора на тайния въпрос (в случай, че има такъв като исторически идентификатор за възстановяване на достъп) и да уведомява незабавно Нет Инфо в случай на осъществен неправомерен достъп, както и при вероятност за такъв. Регистрираният потребител носи пълна отговорност за опазването на своята Парола, както и за всички действия, които се извършват от него или от трето лице чрез използване на Паролата“.
                - listitem [ref=f2e84]: (доп. в сила от 25.05.2018 г.) С цел по-голяма защита, Нет Инфо препоръчва на своите потребители да полагат усилия съставената от тях парола да бъде достатъчно уникална или сложна, за да се предотврати лесното й разпознаване от трети недобросъвестни лица. Нет Инфо препоръчва на своите потребители също така периодичното подменяне на паролата на период от всеки 3 (три) месеца, като новата парола да не съвпада с предишните три, използвани от потребителя по-рано през този период.
                - listitem [ref=f2e85]: Нет Инфо по никакъв повод не изпраща до своите потребители електронни или каквито и да били други писма, съдържащи искане за предоставяне на потребителско име и парола за достъп в абв поща.
                - listitem [ref=f2e86]: (нова в сила от 25.05.2018 г.) Нет Инфо е наясно, че потребителското име и паролата могат да доведат до пряката или непряката идентификация на съответния потребител. В тази връзка тези данни ще бъдат третирани като "лични данни" по реда, описан в Раздел IV "Защита на личните данни".
