                - listitem [ref=f2e107]: (изм. в сила от 25.05.2018 г.) При извършване на промени в настоящите Общи условия, Нет Инфо довежда до знанието на Потребителя извършените промени чрез публикуването им в ABV.bg и/или чрез публикуване на съобщение в Потребителския профил на Регистрирания потребител за изменението на Общите условия, съдържащо текста на измененията или електронна препратка към Интернет страница, на която изменените Общи условия са разположени. Нет Инфо предоставя на Потребителя срок от 7 дни да се запознае с промените в Общите условия.
